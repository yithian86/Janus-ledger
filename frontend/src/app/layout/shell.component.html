<div class="pt-shell">
  <aside class="pt-sidebar" [class.pt-sidebar--collapsed]="isCollapsed">
    <div class="pt-sidebar__brand">
      <span class="pt-sidebar__brand-mark">◆</span>
      <div class="pt-sidebar__brand-copy">
        <span class="pt-sidebar__brand-name">JanusLedger</span>
        <span class="pt-sidebar__brand-meta">v0.1.0</span>
      </div>
      <button type="button" class="pt-sidebar__toggle" (click)="toggleSidebar()" [attr.aria-expanded]="!isCollapsed" aria-label="Toggle sidebar">
        <span class="pt-sidebar__toggle-icon">{{ isCollapsed ? '›' : '‹' }}</span>
      </button>
    </div>
    <nav class="pt-sidebar__nav">
      <a routerLink="/dashboard" routerLinkActive="pt-sidebar__link--active" class="pt-sidebar__link" title="Dashboard">
        <span class="pt-sidebar__link-icon">🏠</span>
        <span class="pt-sidebar__link-label">Dashboard</span>
      </a>
      <a routerLink="/transactions" routerLinkActive="pt-sidebar__link--active" class="pt-sidebar__link" title="Transactions">
        <span class="pt-sidebar__link-icon">🔄</span>
        <span class="pt-sidebar__link-label">Transactions</span>
      </a>
      <a routerLink="/assets" routerLinkActive="pt-sidebar__link--active" class="pt-sidebar__link" title="Assets">
        <span class="pt-sidebar__link-icon">💰</span>
        <span class="pt-sidebar__link-label">Assets</span>
      </a>
      <a routerLink="/reports" routerLinkActive="pt-sidebar__link--active" class="pt-sidebar__link" title="Reports">
        <span class="pt-sidebar__link-icon">📊</span>
        <span class="pt-sidebar__link-label">Reports</span>
      </a>
    </nav>
  </aside>
  <main class="pt-content">
    <router-outlet />
  </main>
</div>
